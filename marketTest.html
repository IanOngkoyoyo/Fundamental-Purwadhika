<script>
    const productName = ['Indomie Goreng', 'Pepsodent', 'Cheetos'];
    const productPrice = [3100, 1900, 11000];
    const productStock = [200, 130, 300];

    let printProducts = '';

    productName.forEach((Item, index) => {
        printProducts += ` ${index + 1}. ${Item}\n`;
    });
   const input = prompt(printProducts + 'Masukkan nomor produk');

   alert(`Nama Produk: ${productName[input - 1]}\nHarga Produk: ${productPrice[input - 1]}\nStok Produk: ${productStock[input - 1]}`);
</script>
